services:
  - type: web
    name: vocalize-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./vocalize.db
      - key: FRONTEND_URL
        fromService:
          type: web
          name: vocalize-web
          property: host
      - key: UPLOAD_DIR
        value: ./uploads

  - type: web
    name: vocalize-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://vocalize-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
