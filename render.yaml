services:
  - type: web
    name: vocalize-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://vocalize-gvlfbg47c-praveen134570s-projects.vercel.app
      - key: UPLOAD_DIR
        value: ./uploads
