services:
  - type: web
    name: vocalize-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vocalize-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://vocalize.vercel.app
      - key: UPLOAD_DIR
        value: ./uploads

databases:
  - name: vocalize-db
    databaseName: vocalize
    user: vocalize
    plan: free
